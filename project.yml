name: Wissh
options:
  bundleIdPrefix: app.wissh
  deploymentTarget:
    iOS: "18.0"
  postGenCommand: >-
    /usr/bin/perl -0pi -e 's/lastKnownFileType = wrapper\.icon;/lastKnownFileType = folder.iconcomposer.icon;/g' Wissh.xcodeproj/project.pbxproj
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.wissh.ios
    PRODUCT_NAME: Wissh
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 12
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    OTHER_LDFLAGS:
      - -lc++
packages:
  Citadel:
    url: https://github.com/h3nock/Citadel.git
    revision: 0697b32db78dab5adaae5aaba1d2749838986a26
targets:
  Wissh:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WisshApp/Sources
      - path: WisshApp/Assets.xcassets
      - path: WisshApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: WisshApp/Resources/install_authorized_key.sh
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Verify GhosttyKit release mode
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/verify_ghosttykit_release_mode.sh"
    dependencies:
      - framework: ../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        embed: false
      - package: Citadel
    info:
      path: WisshApp/Info.plist
      properties:
        CFBundleDisplayName: Wissh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Wissh uses the microphone so you can dictate messages.
        NSSpeechRecognitionUsageDescription: Wissh uses on-device speech recognition to turn your dictation into text.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  WisshTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WisshAppTests
    dependencies:
      - target: Wissh
      - framework: ../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wissh.ios.tests
        PRODUCT_NAME: WisshTests
        PRODUCT_MODULE_NAME: WisshTests
        GENERATE_INFOPLIST_FILE: YES
  WisshUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WisshAppUITests
    dependencies:
      - target: Wissh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wissh.ios.ui-tests
        PRODUCT_NAME: WisshUITests
        PRODUCT_MODULE_NAME: WisshUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WisshUIOnly:
    build:
      targets:
        Wissh: all
        WisshUITests: [test]
    test:
      targets:
        - WisshUITests
  Wissh:
    build:
      targets:
        Wissh: all
        WisshTests: [test]
    test:
      targets:
        - WisshTests
